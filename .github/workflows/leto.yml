name: LetoVPN Update

on:
  workflow_dispatch:
  schedule:
    - cron: "0 0 */2  * *"

permissions:
  contents: read

concurrency:
  group: leto-vpn-update
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fetch LetoVPN configs and update Gist
        env:
          GIST_TOKEN: ${{ secrets.GIST_TOKEN }}
          GIST_ID: ${{ secrets.GIST_ID }}
          GIST_FILENAME: leto.txt
          GIST_DESCRIPTION: LetoVPN VLESS/Trojan subscription
        run: python leto_fetch.py -o leto_out
