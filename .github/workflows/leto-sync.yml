name: Leto Gist to GitFlic

on:
  schedule:
    - cron: "0 1 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: leto-gist-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Download Gist
        shell: bash
        run: |
          set -euo pipefail

          curl -fLsS --retry 3 \
            "https://gist.githubusercontent.com/miro-tech/84998430eb3115e6fb2004ccdf7b1899/raw/leto.txt" \
            -o leto.txt

          test -s leto.txt

          if grep -qiE '<!doctype html|<html([[:space:]>])' leto.txt; then
            echo "ERROR: Invalid source file"
            exit 1
          fi

          echo "Downloaded $(wc -c < leto.txt) bytes"

      - name: Configure Git
        run: |
          git config --global user.name "Leto Sync"
          git config --global user.email "leto-sync@users.noreply.github.com"

      - name: Clone GitFlic
        run: |
          set -euo pipefail

          git clone \
            "https://gitflic.ru/project/mirspectech/leto.git" \
            gitflic-repo

      - name: Commit and Push
        working-directory: gitflic-repo
        env:
          GITFLIC_USERNAME: ${{ secrets.GITFLIC_USERNAME }}
          GITFLIC_TOKEN: ${{ secrets.GITFLIC_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail

          if [[ -z "$GITFLIC_USERNAME" || -z "$GITFLIC_TOKEN" ]]; then
            echo "ERROR: Missing GitFlic credentials"
            exit 1
          fi

          BRANCH="$(git branch --show-current)"

          cp "$GITHUB_WORKSPACE/leto.txt" ./leto.txt

          git add leto.txt

          if git diff --cached --quiet; then
            echo "No changes. Skipping."
            exit 0
          fi

          git commit -m "Sync leto.txt from GitHub Gist"

          ASKPASS="$RUNNER_TEMP/gitflic-askpass.sh"

          cat > "$ASKPASS" <<'EOF'
          #!/bin/sh
          case "$1" in
            *sername*) printf '%s\n' "$GITFLIC_USERNAME" ;;
            *assword*) printf '%s\n' "$GITFLIC_TOKEN" ;;
            *) exit 1 ;;
          esac
          EOF

          chmod 700 "$ASKPASS"

          export GIT_ASKPASS="$ASKPASS"
          export GIT_TERMINAL_PROMPT=0

          git push origin "HEAD:refs/heads/$BRANCH"

          echo "Successfully synchronized leto.txt"
